name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        airflow-version: ["2.5.0", "2.8.0", "2.10.0"]
        include:
          # Test Airflow 3.x with Python 3.9+ (allow failures initially)
          - python-version: "3.9"
            airflow-version: "3.0.0"
            experimental: true
          - python-version: "3.10"
            airflow-version: "3.0.0"
            experimental: true
          - python-version: "3.11"
            airflow-version: "3.0.0"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ hashFiles('requirements-dev.txt', 'setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.airflow-version }}-
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        PYTHON_VERSION="${{ matrix.python-version }}"
        AIRFLOW_VERSION="${{ matrix.airflow-version }}"
        CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
        pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
        pip install -e ".[dev]"
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 airflow_provider_slurm tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 airflow_provider_slurm tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check formatting with black
      run: |
        black --check airflow_provider_slurm tests

    - name: Check import sorting with isort
      run: |
        isort --check-only airflow_provider_slurm tests

    - name: Type check with mypy
      run: |
        mypy airflow_provider_slurm

    - name: Test with pytest
      run: |
        pytest tests/unit/ --cov=airflow_provider_slurm --cov-report=xml --cov-report=term-missing --cov-report=html --junitxml=pytest-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        file: ./coverage.xml
        flags: unittests
        name: py${{ matrix.python-version }}-airflow${{ matrix.airflow-version }}
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Coverage comment
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 70

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-py${{ matrix.python-version }}-airflow${{ matrix.airflow-version }}
        path: |
          pytest-results.xml
          htmlcov/
        retention-days: 30

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-2.8.0/constraints-3.10.txt"
        pip install "apache-airflow==2.8.0" --constraint "${CONSTRAINT_URL}"
        pip install -e ".[dev]"
        pip install -r requirements-dev.txt

    - name: Run integration tests (mocked)
      run: |
        pytest tests/integration/ -v --junitxml=pytest-integration.xml

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-results
        path: pytest-integration.xml
        retention-days: 30

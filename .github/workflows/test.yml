name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        airflow-version: ["2.5.0", "2.8.0"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.airflow-version }}-
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install apache-airflow==${{ matrix.airflow-version }}
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        flake8 airflow_slurm_executor tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 airflow_slurm_executor tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check formatting with black
      run: |
        black --check airflow_slurm_executor tests

    - name: Check import sorting with isort
      run: |
        isort --check-only airflow_slurm_executor tests

    - name: Type check with mypy
      run: |
        mypy airflow_slurm_executor

    - name: Test with pytest
      run: |
        pytest tests/unit/ --cov=airflow_slurm_executor --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install apache-airflow==2.8.0
        pip install -e ".[dev]"

    - name: Run integration tests (mocked)
      run: |
        pytest tests/integration/ -v
name: "CodeQL Security Scan"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Query suites: default, security-extended, security-and-quality
        queries: security-and-quality

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Use latest stable Airflow 2.x for CodeQL analysis
        CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-2.10.0/constraints-3.10.txt"
        pip install "apache-airflow==2.10.0" --constraint "${CONSTRAINT_URL}"
        pip install -e .

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

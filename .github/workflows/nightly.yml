name: "Nightly Tests"

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test-latest-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install latest dependencies
      run: |
        python -m pip install --upgrade pip
        # Install latest Airflow
        pip install --upgrade apache-airflow
        # Install project with latest dependencies
        pip install --upgrade -e ".[dev]"

    - name: Display installed versions
      run: |
        python --version
        pip list | grep -E "(airflow|requests|pytest)"

    - name: Run tests
      run: |
        pytest tests/unit/ --cov=airflow_slurm_executor --cov-report=xml --cov-report=term-missing
      continue-on-error: true

    - name: Upload nightly test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-test-results-py${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 7

  notify-failures:
    runs-on: ubuntu-latest
    needs: test-latest-dependencies
    if: failure()
    steps:
    - name: Create issue on failure
      uses: actions/github-script@v7
      with:
        script: |
          const title = '⚠️ Nightly tests failed';
          const body = `The nightly test run failed on ${new Date().toISOString()}.

          This may indicate:
          - Breaking changes in latest Airflow release
          - Incompatible dependency updates
          - Regression in our code

          Please investigate: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

          // Check if issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'nightly-failure'
          });

          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['nightly-failure', 'bug', 'needs-triage']
            });
          }

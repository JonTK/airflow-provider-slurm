[tox]
envlist = py{38,39,310,311}, lint, type
isolated_build = True

[testenv]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
    responses>=0.22.0
commands =
    pytest {posargs}

[testenv:lint]
skip_install = True
deps =
    black>=22.0.0
    isort>=5.10.0
    flake8>=5.0.0
commands =
    black --check airflow_slurm_executor tests
    isort --check-only airflow_slurm_executor tests
    flake8 airflow_slurm_executor tests

[testenv:type]
deps =
    mypy>=0.990
    types-requests
    {[testenv]deps}
commands =
    mypy airflow_slurm_executor

[testenv:format]
skip_install = True
deps =
    black>=22.0.0
    isort>=5.10.0
commands =
    black airflow_slurm_executor tests
    isort airflow_slurm_executor tests

[testenv:docs]
deps =
    sphinx>=5.0.0
    sphinx-rtd-theme>=1.0.0
commands =
    sphinx-build -b html docs docs/_build/html
